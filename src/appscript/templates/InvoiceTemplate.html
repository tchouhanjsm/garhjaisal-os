<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Invoice</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    font-size:12px;
    color:#222;
    margin:30px;
}

h1,h2,h3{
    margin:0;
}

table{
    width:100%;
    border-collapse:collapse;
}

.header td{
    vertical-align:top;
}

.company{
    font-size:22px;
    font-weight:bold;
}

.subtitle{
    color:#555;
    line-height:18px;
}

.section{
    margin-top:18px;
}

.item-table{
    margin-top:10px;
}

.item-table th{
    border:1px solid #888;
    background:#f3f3f3;
    padding:8px;
    text-align:left;
}

.item-table td{
    border:1px solid #bbb;
    padding:8px;
}

.right{
    text-align:right;
}
.info-table td{
    vertical-align:top;
    padding:4px 0;
}

.center{
    text-align:center;
}

.total-table{
    width:320px;
    margin-left:auto;
    margin-top:15px;
}

.total-table td{
    padding:5px;
}

.total{
    font-size:15px;
    font-weight:bold;
}

.footer{
    margin-top:40px;
    font-size:11px;
    color:#555;
}

hr{
    border:none;
    border-top:1px solid #bbb;
    margin:15px 0;
}

</style>
</head>

<body>

<table class="header">

<tr>

<td>

<?= hotel.name ?><br>

<div class="subtitle">

<?= hotel.address ?><br>

<?= hotel.city ?><br>

GSTIN : <?= invoice.gstin ?><br>

Phone : <?= hotel.phone ?><br>

Email : <?= hotel.email ?><br>

<?= hotel.website ?>

</div>

</td>

<td class="right">

<h2>TAX INVOICE</h2>

Invoice No<br>

<b><?= invoice.invoiceId ?></b>

</td>

</tr>

</table>
<hr>

<table class="info-table">
<tr>
<td width="55%">

<b>Bill To</b><br><br>

<b><? if (invoice.company && invoice.company !== "DIRECT") { ?></b><br>

<? if (invoice.companyAddress) { ?>
<?= invoice.companyAddress ?><br>
<? } ?>

<br>

<b>Guest</b><br>

<?= invoice.guestName ?>

<? } else { ?>

<b><?= invoice.guestName ?></b>

<? } ?>

</td>

<td width="45%">

<table>

<tr>
<td><b>Invoice Date</b></td>
<td><?= invoice.invoiceDate ?></td>
</tr>

<tr>
<td><b>Booking ID</b></td>
<td><?= invoice.bookingId ?></td>
</tr>

<tr>
<td><b>Check-in</b></td>
<td><?= invoice.checkIn ?></td>
</tr>

<tr>
<td><b>Check-out</b></td>
<td><?= invoice.checkOut ?></td>
</tr>

<tr>
<td><b>Nights</b></td>
<td><?= invoice.nights ?></td>
</tr>

</table>

</td>
</tr>
</table>
<hr>

<h3>Invoice Items</h3>
<table class="item-table">
<tr>

<th>#</th>

<th>Description</th>

<th class="center">Qty</th>

<th class="center">Unit</th>

<th class="right">Rate</th>

<th class="right">GST</th>

<th class="right">Amount</th>

</tr>

<? for (var i = 0; i < items.length; i++) { ?>

<tr>

  <td class="center"><?= i + 1 ?></td>

  <td><?= items[i].description ?></td>

  <td class="center"><?= items[i].quantity ?></td>

  <td class="center"><?= items[i].unit ?></td>

  <td class="right"><?= items[i].rate ?></td>

  <td class="right"><?= items[i].taxAmount ?></td>

  <td class="right"><?= items[i].amount ?></td>

</tr>

<? } ?>

</table>
<hr>

<table class="total-table">

<tr>

<td><b>Subtotal</b></td>

<td class="right"><?= invoice.subtotal ?></td>

</tr>

<tr>

<td><b>GST</b></td>

<td class="right"><?= invoice.gstAmount ?></td>

</tr>

<tr>

<td class="total">

<b>Total</b>

</td>

<td class="right total">

<?= invoice.totalAmount ?>

</td>

</tr>

<tr>

<td><b>Paid</b></td>

<td class="right">

<?= invoice.amountPaid ?>

</td>

</tr>

<tr>

<td>

<b>Balance Due</b>

</td>

<td class="right">

<b><?= invoice.balance ?></b>

</td>

</tr>

</table>

<br><br><br><br>

<hr>

<div class="footer">

<b>Bank Details</b><br>

<?= hotel.accountName ?><br>

<?= hotel.bankName ?><br>

A/C : <?= hotel.accountNo ?><br>

IFSC : <?= hotel.ifsc ?><br>

UPI : <?= hotel.upiId ?>

Thank you for staying with Garh Jaisal Haveli.

</div>

</body>
</html>
